<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PricempirePlus</title>
    <style>
      body {
        margin: 0;
        width: 320px;
        padding: 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 15px;
      }
      .row {
        border: 1px solid #334155;
        border-radius: 8px;
        background: #1e293b;
        padding: 10px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        font-size: 14px;
      }
      #status {
        min-height: 16px;
        margin-top: 8px;
        font-size: 12px;
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <h1>PricempirePlus</h1>
    <div class="row">
      <label>
        <input id="move-market-offers" type="checkbox" />
        Move Market Offers to Bottom
      </label>
      <div id="status"></div>
    </div>
    <script src="popup.js"></script>
  </body>
  </html>
